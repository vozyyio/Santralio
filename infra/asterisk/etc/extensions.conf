; Santralio: ortak dialplan.
; Kiracı context'leri (tN-inbound, tN-internal) tenants/<kiracı>/extensions.conf olarak üretilir.

[general]
static=yes
writeprotect=yes
clearglobalvars=yes
autofallthrough=yes

[globals]

; Eşleşmeyen her şey buraya düşer. Hiçbir yere bağlamaz.
[reject]
exten => _[+*#0-9a-zA-Z].,1,NoOp(Santralio reject: ${EXTEN} ${CHANNEL})
 same => n,Hangup(21)
exten => i,1,Hangup(21)
exten => s,1,Hangup(21)

; Paketle gelen örnek ayarlarda kullanılan default context de reddeder.
[default]
include => reject

; Kiracı rutinlerinin ortak kısmı. TENANT değişkeni arayandan değil,
; endpoint'in set_var ayarından gelir.
[santralio-lib]
; Kiracının eş zamanlı kanal sınırını uygular: Gosub(santralio-lib,limit,1(<sınır>))
exten => limit,1,Set(GROUP(santralio-tenant)=${TENANT})
 same => n,GotoIf($[${GROUP_COUNT(${TENANT}@santralio-tenant)} > ${ARG1}]?full)
 same => n,Return()
 same => n(full),NoOp(Santralio: ${TENANT} kanal sınırı ${ARG1} aşıldı)
 same => n,Hangup(34)

; Temsilciye giden her kanala (Dial b() ön işleyicisi) temsilci ekranı için bilgi ekler.
exten => agent-headers,1,ExecIf($["${SANTRALIO_QUEUE}" != ""]?Set(PJSIP_HEADER(add,X-Santralio-Queue)=${SANTRALIO_QUEUE}))
 same => n,ExecIf($["${SANTRALIO_DID}" != ""]?Set(PJSIP_HEADER(add,X-Santralio-DID)=${SANTRALIO_DID}))
 same => n,Return()

; Kayıt: kuyruk, temsilci açınca bunu temsilcinin kanalında çalıştırır (Queue'nun gosub parametresi).
; Queue bu parametrede "^" ayracını çevirmez; yalnızca context adı verilir ve s,1 çalışır.
; Kayıt yalnızca arayanla temsilci bağlıyken yapılır (b); bekleme müziği kayda girmez.
[santralio-record]
exten => s,1,MixMonitor(${SANTRALIO_RECDIR}/${SANTRALIO_CALLID}.wav,b)
 same => n,QueueLog(${SANTRALIO_QLOG},${SANTRALIO_CALLID},NONE,SANTRALIO_RECORDING,${SANTRALIO_CALLID}.wav)
 same => n,Return()

; Yalnızca testler için: aramayı açar, kısa bir ses çalar, kapatır. Hiçbir kiracı context'i buraya bağlanmaz;
; testler AMI ile geçici kuyruk üyesi olarak ekler (infra/asterisk/tests/check_recording.sh).
[santralio-test-answer]
exten => s,1,Answer()
 same => n,Playback(tt-monkeys)
 same => n,Hangup()

#tryinclude tenants/*/extensions.conf
