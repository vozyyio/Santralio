; Santralio: Asterisk'in PostgreSQL bağlantısı. Yalnızca kuyruk olayları (queue_log) için kullanılır.
; Unix soketi ve yerel kullanıcı eşlemesi (peer): şifre yoktur; "asterisk" rolü yalnızca queue_log'a satır ekleyebilir.

[general]
dbhost=/var/run/postgresql
dbport=5432
dbname=santralio
dbuser=asterisk
dbpass=
requirements=warn
