; Santralio: ortak PJSIP ayarları.
; Kiracıya ait trunk, dahili ve kayıt nesneleri elle yazılmaz.
; Kontrol servisi onları tenants/<kiracı>/pjsip.conf olarak üretir.

[global]
type=global
user_agent=Santralio
; ip ile eşleme kullanılmaz: birden fazla kiracı aynı operatörün IP'lerinden arama alır.
; anonymous yoktur: kimliği eşleşmeyen istek reddedilir.
; Trunk'lar outbound registration'ın line=yes eşlemesiyle bulunur (adsız tanımlayıcı).
endpoint_identifier_order=request_uri,username,auth_username
unidentified_request_count=3
unidentified_request_period=10
max_forwards=20

[system]
type=system

; --- Transport'lar ---

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
tos=cs3

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
tos=cs3

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/sip.santralio.site.crt
priv_key_file=/etc/asterisk/keys/sip.santralio.site.key
method=tlsv1_2
verify_client=no
verify_server=yes
tos=cs3

; --- Kiracılar ---
#tryinclude tenants/*/pjsip.conf
