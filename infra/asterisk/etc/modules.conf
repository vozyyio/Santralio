; Santralio: yüklenecek modüller.
; Kullanılmayan kanal sürücüleri ve dialplan motorları kapalı tutulur.
; Kiracı santrali yalnızca PJSIP ve pbx_config (extensions.conf) ile çalışır.

[modules]
autoload=yes

; Kanal sürücüleri: yalnızca chan_pjsip kullanılır.
noload => chan_iax2.so
noload => chan_unistim.so
noload => chan_motif.so
noload => chan_console.so
noload => chan_mobile.so
noload => chan_dahdi.so
noload => chan_ooh323.so

; Dialplan motorları: yalnızca pbx_config kullanılır.
noload => pbx_ael.so
noload => pbx_lua.so
noload => pbx_dundi.so
noload => pbx_realtime.so

; Realtime kullanılmaz (bkz. docs/architecture.md, "Konfigürasyon üretimi").
noload => res_config_odbc.so
noload => res_config_pgsql.so
noload => res_config_mysql.so
noload => res_config_sqlite3.so
noload => res_config_ldap.so

; Gereksiz servisler.
noload => res_phoneprov.so
noload => res_pjsip_phoneprov_provider.so
noload => res_xmpp.so
noload => res_snmp.so
noload => res_corosync.so

; Kullanılmayan kayıt arka uçları ve sesli posta varyantları.
; CDR ve CEL 4. adımda PostgreSQL'e yazılacak; o zaman ayrıca açılır.
noload => app_voicemail_odbc.so
noload => app_voicemail_imap.so
noload => cdr_pgsql.so
noload => cdr_radius.so
noload => cdr_sqlite3_custom.so
noload => cdr_tds.so
noload => cel_radius.so
noload => cel_sqlite3_custom.so
noload => cel_tds.so
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so

load => res_musiconhold.so
