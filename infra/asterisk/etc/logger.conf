; Santralio: günlükler.
; security olayları fail2ban tarafından /var/log/asterisk/messages.log dosyasından okunur.

[general]
dateformat=%F %T.%3q
; Kuyruk olayları: PostgreSQL'e (extconfig.conf) ve yedek olarak dosyaya. Zaman UTC.
queue_log=yes
queue_log_to_file=yes
queue_log_realtime_use_gmt=yes

[logfiles]
console => notice,warning,error
messages.log => notice,warning,error,security
