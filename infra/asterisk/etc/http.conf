; Santralio: dahili HTTP sunucusu. Yalnızca localhost'u dinler.
; Şimdilik tek kullanımı temsilci masasının SIP-over-WebSocket bağlantısı (/ws).
; Caddy bunu wss://panel.santralio.site/ws olarak, oturum denetiminden sonra iletir.
; ARI kapalıdır (ari.conf); AMI HTTP üzerinden açılmaz (manager.conf webenabled varsayılanı no).

[general]
enabled=yes
enablestatic=no
bindaddr=127.0.0.1
bindport=8088
